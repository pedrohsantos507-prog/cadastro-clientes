<div class="container">
  <h2>Cadastro de Clientes</h2>

  <form (ngSubmit)="cadastrar()">
    <label>Nome</label>
    <input type="text" name="nome" [(ngModel)]="cliente.nome" required />

    <label>CPF</label>
    <input type="text" name="cpf" [(ngModel)]="cliente.cpf" required />

    <label>E-mail</label>
    <input type="email" name="email" [(ngModel)]="cliente.email" required />

    <label>Telefone</label>
    <input type="text" name="telefone" [(ngModel)]="cliente.telefone" required />

    <label>CEP</label>
    <input type="text" name="cep" [(ngModel)]="cliente.cep" (blur)required/>

    <label>Endereço</label>
    <input type="text" name="endereco" [(ngModel)]="cliente.endereco"readonly/>

    <label>Bairro</label>
    <input type="text" name="bairro" [(ngModel)]="cliente.bairro"reandoly/>

    <label>Cidade</label>
    <input type="text" name="cidade" [(ngModel)]="cliente.cidade"required/>

    <label>UF</label>
    <input type="text" name="uf" maxlength="2" [(ngModel)]="cliente.uf"reandoly/>

    <label>Complemento</label>
    <input type="text" name="complemento" [(ngModel)]="cliente.complemento"/>

    <button type="submit">
      {{ clienteService.estaEditando() ? 'atualizar Cliente' : 'cadastrar Cliente' }}
    </button>
  </form>
</div>
