<section class="lista-cliente">

  <h2>Lista de Clientes</h2>

  <table>

    <thead>
      <tr>
        <th>Nome</th>
        <th>Telefone</th>
        <th>E-mail</th>
        <th>Cpf</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let cliente of clienteFiltrados(); let i = index">

        <td>{{ cliente.nome }}</td>
        <td>{{ cliente.telefone }}</td>
        <td>{{ cliente.email }}</td>

        <td>
          <button class="editar">editar</button>
          <button class="excluir">excluir</button>
        </td>
      </tr>
    </tbody>
</section>
