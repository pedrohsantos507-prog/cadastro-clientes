<div class="container">

  <h2>Clientes Cadastrados</h2>

  <table>

    <thead>

      <tr>
        <th>Nome</th>
        <th>CPF</th>
        <th>E-mail</th>
        <th>Telefone</th>
      </tr>

    </thead>

    <tbody>

      <tr *ngFor="let cliente of clientes">

        <td>{{ cliente.nome }}</td>
        <td>{{ cliente.cpf }}</td>
        <td>{{ cliente.email }}</td>
        <td>{{ cliente.telefone }}</td>

      </tr>

    </tbody>

  </table>

</div>
